name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # requires-python is ">=3.11", so both ends of that promise are tested:
      # 3.11 is what the image ships, 3.13 is the newest release it claims.
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint
        run: ruff check .

      - name: Test
        # e2e is excluded: it needs a real browser (playwright install), an LLM
        # key, and network egress. The real-Chromium smoke test is powered by the
        # separate browser-smoke job below (this job does not install Chromium).
        run: pytest tests/ --ignore=tests/e2e -v --tb=short

  # D1 (2026-07-17 review): keep the A1 Chromium smoke test electrified. The
  # suite skips when Chromium is absent, so without this job the guard never
  # runs in CI. Uses data: URLs only — no external network needed.
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m playwright install --with-deps chromium

      - name: Real-Chromium evaluate smoke
        run: pytest tests/test_browser_evaluate_smoke.py -v --tb=short

  # ── 汇总门 ──────────────────────────────────────────────────────────
  # ⚠️ job 名**就是** required check 名。ReadyForAI 组织级 ruleset 统一只认 `ci`
  # 这一个名字（各仓真实 job 名互不相同，无法写进一张全局名单）。改名 = 本仓 PR 全卡住。
  #
  # ⚠️ `if: always()` **不能省**。没有它，任一上游 job 失败时本 job 会被 **skip**，
  # 而 **skipped 的必需检查在 ruleset 里算「通过」** —— 门会静默失效、全绿放行。
  # 这是这个模式最经典的坑，别删。
  #
  # 判据：上游只允许 success / skipped（被 `paths` 或 `if` 跳过属正常）；
  # failure / cancelled 一律红。
  ci:
    needs: [lint-and-test, browser-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总上游 job 结果
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          r = {k: v["result"] for k, v in json.loads(os.environ["NEEDS"]).items()}
          bad = [k for k, v in r.items() if v not in ("success", "skipped")]
          for k, v in sorted(r.items()):
              print(f"{k}: {v}")
          if bad:
              print(f"::error::上游未通过: {', '.join(bad)}")
              sys.exit(1)
          PY
