# Build the `mantisfetch` sdist + wheel and publish them to PyPI through
# trusted publishing (OIDC; no API token is stored in the repo).
#
# Manual only until PyPI is set up for it — a release-triggered run before then
# would fail on every release. Before the first run, on pypi.org:
#   1. add a pending trusted publisher for project `mantisfetch`:
#      owner ReadyForAI, repository MantisFetch, workflow publish.yml,
#      environment pypi;
#   2. create the `pypi` environment in this repository's settings.
# Run it from the tag being released, so the version comes from that tag's
# mantisfetch_common.__version__.
name: publish

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
