
services:
  mantisfetch:
    build: .
    ports:
      - "9898:9898"
    volumes:
      - ${MANTISFETCH_HOST_DOCS_DIR:-${HOME}/.mantisfetch/docs}:/root/.mantisfetch/docs
      # TLS cert/key (read-only). Empty dir = no TLS (plain http).
      - ./certs:/certs:ro
    environment:
      MANTISFETCH_DOCS_DIR: /root/.mantisfetch/docs
      # Bearer token for /mcp, /web and /doc. Without it these surfaces are
      # loopback-only — and a host request to the published port reaches the
      # container from the Docker bridge (a NON-loopback peer), so it is denied
      # (403). SET THIS to use /web and /doc against the container. ALLOWED_HOSTS
      # adds extra Host values (host:* = any port) past the DNS-rebinding check.
      MANTISFETCH_MCP_TOKEN: ${MANTISFETCH_MCP_TOKEN:-}
      MANTISFETCH_MCP_ALLOWED_HOSTS: ${MANTISFETCH_MCP_ALLOWED_HOSTS:-}
      # TLS (opt-in): set these in .env to serve https. Bearer over an encrypted
      # line (#702: https + bearer, no mTLS client cert). Unset → plain http.
      MANTISFETCH_TLS_CERTFILE: ${MANTISFETCH_TLS_CERTFILE:-}
      MANTISFETCH_TLS_KEYFILE: ${MANTISFETCH_TLS_KEYFILE:-}
      # LLM provider (default: gemini)
      # The provider has a default; the *model* does not, on purpose — a model
      # name in the code is only correct until the vendor retires it. Set
      # MANTISFETCH_LLM_MODEL (below) or the per-role slot keys, or summaries
      # and LLM OCR will refuse with a message naming the key. Startup warns and
      # GET /health reports what each role resolved to.
      MANTISFETCH_LLM_PROVIDER: ${MANTISFETCH_LLM_PROVIDER:-gemini}
      MANTISFETCH_LLM_VENDOR: ${MANTISFETCH_LLM_VENDOR:-openai}
      # Gemini / Google AI credentials
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # OpenAI-compatible provider settings (used when MANTISFETCH_LLM_PROVIDER=openai)
      MANTISFETCH_LLM_API_KEY: ${MANTISFETCH_LLM_API_KEY:-}
      # Leave empty so vendor profiles (zhipu/kimi/...) supply their base_url.
      # Set explicitly only when overriding (e.g. a proxy or local Ollama).
      MANTISFETCH_LLM_BASE_URL: ${MANTISFETCH_LLM_BASE_URL:-}
      # Model selection BY KIND — applies to every provider, gemini included, not
      # just the openai-compatible block above. Superseded by the per-role
      # MANTISFETCH_{SUM,OCR}_MODEL_* keys below when the dual-slot scheme is on.
      MANTISFETCH_LLM_MODEL: ${MANTISFETCH_LLM_MODEL:-}
      MANTISFETCH_OCR_MODEL: ${MANTISFETCH_OCR_MODEL:-}
      MANTISFETCH_OCR_IMAGE_INPUT_MODE: ${MANTISFETCH_OCR_IMAGE_INPUT_MODE:-}
      MANTISFETCH_LLM_EXTRA_BODY_JSON: ${MANTISFETCH_LLM_EXTRA_BODY_JSON:-}
      MANTISFETCH_OCR_EXTRA_BODY_JSON: ${MANTISFETCH_OCR_EXTRA_BODY_JSON:-}
      # Per-role providers + failover (dual-slot). Unset MANTISFETCH_LLM_DEFAULT =
      # legacy single-provider mode; set it to switch on the two-slot scheme.
      MANTISFETCH_LLM_DEFAULT: ${MANTISFETCH_LLM_DEFAULT:-}
      MANTISFETCH_LLM_DEFAULT_BASE_URL: ${MANTISFETCH_LLM_DEFAULT_BASE_URL:-}
      MANTISFETCH_LLM_DEFAULT_API_KEY: ${MANTISFETCH_LLM_DEFAULT_API_KEY:-}
      MANTISFETCH_LLM_EXTRA: ${MANTISFETCH_LLM_EXTRA:-}
      MANTISFETCH_LLM_EXTRA_BASE_URL: ${MANTISFETCH_LLM_EXTRA_BASE_URL:-}
      MANTISFETCH_LLM_EXTRA_API_KEY: ${MANTISFETCH_LLM_EXTRA_API_KEY:-}
      MANTISFETCH_SUM_MODEL_DEFAULT: ${MANTISFETCH_SUM_MODEL_DEFAULT:-}
      MANTISFETCH_SUM_MODEL_FALLBACK: ${MANTISFETCH_SUM_MODEL_FALLBACK:-}
      MANTISFETCH_OCR_MODEL_DEFAULT: ${MANTISFETCH_OCR_MODEL_DEFAULT:-}
      MANTISFETCH_OCR_MODEL_FALLBACK: ${MANTISFETCH_OCR_MODEL_FALLBACK:-}
      MANTISFETCH_DOC_ID_STRATEGY: ${MANTISFETCH_DOC_ID_STRATEGY:-counter}
      MANTISFETCH_MAX_CONCURRENT_PARSE: ${MANTISFETCH_MAX_CONCURRENT_PARSE:-2}
      # How long a parse may wait for one of those slots when a budget was not
      # declared, and how many bytes of staged upload the queue may hold.
      MANTISFETCH_PARSE_QUEUE_MAX_WAIT_SEC: ${MANTISFETCH_PARSE_QUEUE_MAX_WAIT_SEC:-600}
      MANTISFETCH_PARSE_QUEUE_MAX_BYTES: ${MANTISFETCH_PARSE_QUEUE_MAX_BYTES:-}
      # Keep the uploaded original beside the parse, under the document's
      # source/. On by default in code too, but stated here so it is a declared
      # deployment property rather than one inherited from a default: the raw
      # channel (store_only=true) refuses with a 422 without it, /library/{id}/source
      # has nothing to serve, and the loss is silent and unrecoverable — the
      # original is gone once the upload connection closes.
      MANTISFETCH_STORE_SOURCE_FILES: ${MANTISFETCH_STORE_SOURCE_FILES:-true}
      # Raw channel (store_only=true) per-type ceilings, in MiB. These are a
      # cross-product contract — AULO refuses oversize uploads client-side
      # against the same two numbers (2,097,152 / 8,388,608 bytes).
      MANTISFETCH_RAW_MAX_MD_MB: ${MANTISFETCH_RAW_MAX_MD_MB:-2}
      MANTISFETCH_RAW_MAX_IMAGE_MB: ${MANTISFETCH_RAW_MAX_IMAGE_MB:-8}
      MANTISFETCH_LOCAL_OCR_CONCURRENCY: ${MANTISFETCH_LOCAL_OCR_CONCURRENCY:-1}
      MANTISFETCH_PREWARM_LOCAL_OCR: ${MANTISFETCH_PREWARM_LOCAL_OCR:-true}
      # Note: the local-OCR master switch MANTISFETCH_LOCAL_OCR_ENABLED is intentionally
      # NOT set here — it is baked into the image by the WITH_LOCAL_OCR build arg (false
      # in the slim variant). Prewarm is gated on it too, so the line above is a no-op
      # for the slim image. Override at runtime with `-e` if you need to force it.
      # Both of these bound the WHOLE PROCESS, which is shared by every NodalOS
      # behind this MantisFetch — not one caller. MAX_CONCURRENT is how many
      # summaries run at once (raise it against the provider's rate limit, not
      # by feel); MAX_QUEUED is how many may wait, past which a document is
      # stored with summary_status=not_queued and can be retried.
      MANTISFETCH_DEFERRED_SUMMARY_MAX_CONCURRENT: ${MANTISFETCH_DEFERRED_SUMMARY_MAX_CONCURRENT:-1}
      MANTISFETCH_DEFERRED_SUMMARY_MAX_QUEUED: ${MANTISFETCH_DEFERRED_SUMMARY_MAX_QUEUED:-64}
      MANTISFETCH_SUMMARY_BATCH_CONCURRENCY: ${MANTISFETCH_SUMMARY_BATCH_CONCURRENCY:-1}
      MANTISFETCH_SUMMARY_REQUEST_MIN_INTERVAL_SEC: ${MANTISFETCH_SUMMARY_REQUEST_MIN_INTERVAL_SEC:-2.0}
      MANTISFETCH_SUMMARY_SECTION_DETAIL_LIMIT: ${MANTISFETCH_SUMMARY_SECTION_DETAIL_LIMIT:-10}
      # Web search (opt-in): unset MANTISFETCH_SEARCH_PROVIDER = search disabled
      # (/web/search* 404, MCP search tools not registered). With the `search`
      # profile below, set MANTISFETCH_SEARCH_PROVIDER=searxng — the SearXNG URL
      # defaults to the in-compose service.
      MANTISFETCH_SEARCH_PROVIDER: ${MANTISFETCH_SEARCH_PROVIDER:-}
      # A burst of searches queues against the provider's rate limit for up to
      # this long before it is refused with Retry-After.
      MANTISFETCH_SEARCH_MAX_WAIT_SEC: ${MANTISFETCH_SEARCH_MAX_WAIT_SEC:-30}
      MANTISFETCH_SEARCH_FALLBACK: ${MANTISFETCH_SEARCH_FALLBACK:-}
      # Addressable set for per-request `provider` selection (adds to primary + fallback).
      MANTISFETCH_SEARCH_PROVIDERS: ${MANTISFETCH_SEARCH_PROVIDERS:-}
      MANTISFETCH_SEARXNG_URL: ${MANTISFETCH_SEARXNG_URL:-http://searxng:8080}
      MANTISFETCH_SEARCH_API_KEY: ${MANTISFETCH_SEARCH_API_KEY:-}
      # Per-provider keys (override the shared one) — needed to run more than one
      # API provider at once, e.g. bocha for CN + tavily for EN.
      MANTISFETCH_TAVILY_API_KEY: ${MANTISFETCH_TAVILY_API_KEY:-}
      MANTISFETCH_BOCHA_API_KEY: ${MANTISFETCH_BOCHA_API_KEY:-}
      MANTISFETCH_BRAVE_API_KEY: ${MANTISFETCH_BRAVE_API_KEY:-}
      MANTISFETCH_SEARCH_MAX_RESULTS: ${MANTISFETCH_SEARCH_MAX_RESULTS:-10}
      MANTISFETCH_SEARCH_MIN_INTERVAL_SEC: ${MANTISFETCH_SEARCH_MIN_INTERVAL_SEC:-2}
      # Markdown fast path: ask the site for markdown before opening a browser.
      # Off by default — a negotiated capture has no tables, and the request must
      # also pass extract_tables=false for this to do anything.
      MANTISFETCH_NEGOTIATE_MARKDOWN: ${MANTISFETCH_NEGOTIATE_MARKDOWN:-0}
      MANTISFETCH_NEGOTIATE_CONCURRENCY: ${MANTISFETCH_NEGOTIATE_CONCURRENCY:-20}
      # Browser gates. Both queue rather than refuse at the door; a burst waits
      # up to CONCURRENCY_MAX_WAIT_SEC and only then gets a 429 with Retry-After.
      MANTISFETCH_MAX_CONCURRENT_CAPTURE: ${MANTISFETCH_MAX_CONCURRENT_CAPTURE:-16}
      MANTISFETCH_MAX_CONCURRENT_SESSIONS: ${MANTISFETCH_MAX_CONCURRENT_SESSIONS:-20}
      MANTISFETCH_CONCURRENCY_MAX_WAIT_SEC: ${MANTISFETCH_CONCURRENCY_MAX_WAIT_SEC:-30}
      MANTISFETCH_SESSION_MAXSIZE: ${MANTISFETCH_SESSION_MAXSIZE:-200}
      # Capture URL cache (search_and_capture defaults to 24h; plain capture stays 0)
      MANTISFETCH_CAPTURE_TTL_HOURS: ${MANTISFETCH_CAPTURE_TTL_HOURS:-0}
      MANTISFETCH_SEARCH_CAPTURE_TTL_HOURS: ${MANTISFETCH_SEARCH_CAPTURE_TTL_HOURS:-24}
    # Hardening: the app binds a high port (9898), launches Chromium with
    # --no-sandbox, and only writes paths it owns, so it needs no privilege
    # escalation and (almost) no Linux capabilities. DAC_OVERRIDE is kept so the
    # container's root can still write a bind-mounted docs volume that is owned by
    # a *different* host user (e.g. ~/.mantisfetch/docs created by a prior local
    # run) — otherwise the default `docker compose up` would fail to persist. A
    # fully hardened deployment with an aligned volume owner can drop it too; see
    # DEPLOYMENT.md.
    cap_drop: ["ALL"]
    cap_add: ["DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Zero-cost self-hosted metasearch for MANTISFETCH_SEARCH_PROVIDER=searxng.
  # Opt-in: `docker compose --profile search up` starts it alongside MantisFetch.
  # Settings live in ./configs/searxng/ (settings.yml = international default;
  # settings.cn.yml = China preset — see the README "Web search" section).
  searxng:
    image: searxng/searxng:latest
    profiles: [search]
    volumes:
      - ./configs/searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
    restart: unless-stopped
