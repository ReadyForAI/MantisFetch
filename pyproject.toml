[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mantisfetch"
dynamic = ["version"]
description = "Open-source data collection and document parsing platform"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ReadyForAI", email = "opensource@readyfor.ai" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "playwright>=1.45.0",
    "markitdown[pdf,docx,pptx,xlsx,xls]>=0.1.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "google-genai>=0.8.0",
    "openai>=1.0.0",
    "Pillow>=10.4.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "mcp>=2,<3",
]

[project.urls]
Homepage = "https://github.com/ReadyForAI/MantisFetch"
Repository = "https://github.com/ReadyForAI/MantisFetch"

[tool.setuptools.dynamic]
version = { attr = "mantisfetch_common.__version__" }

[tool.setuptools]
# Top-level modules the service packages import by name. Without these an
# installed wheel raises ModuleNotFoundError on the first import — both service
# packages do `import i18n`.
py-modules = ["i18n", "mantisfetch_deliverables", "mantisfetch_server"]

[tool.setuptools.package-data]
# Files the code opens at runtime, which a wheel would otherwise drop: the
# Readability bundle the browser injects, the shipped document profiles, and the
# PaddleOCR worker (launched as a subprocess by path, so it has to be on disk).
mantisfetch_browser = ["readability.js"]
mantisfetch_docreader = ["config_profiles/*/*.json", "paddle_ocr_worker.py"]

[tool.setuptools.packages.find]
# The service packages live under services/<name>/, but they are imported as
# top-level names (`import mantisfetch_docreader`), which is what running from
# the repo works out via sys.path. Listing each parent as a search root makes an
# installed wheel expose the same names, instead of burying them under
# `services.docreader.…` where nothing looks for them.
where = [".", "services/browser", "services/docreader", "services/mcp"]
include = ["mantisfetch*", "providers*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
asyncio_mode = "auto"
markers = [
    "live: requires a running MantisFetch server (localhost:9898) and network access",
    "live_llm: requires a running server AND a configured LLM API key",
]
